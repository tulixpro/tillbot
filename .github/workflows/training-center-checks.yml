name: Training Center Syntax Checks

on:
  pull_request:
    paths:
      - "server.js"
      - "database.js"
      - "app.js"
      - "index.html"
      - "training.html"
      - "sw.js"
      - ".github/workflows/training-center-checks.yml"

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check backend and frontend JavaScript
        run: |
          node --check server.js
          node --check app.js
      - name: Check embedded training page JavaScript
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          html = Path("training.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script>(.*?)</script>", html, flags=re.S)
          if len(scripts) != 1:
              raise SystemExit(f"Expected one inline script, found {len(scripts)}")
          Path("/tmp/training-inline.js").write_text(scripts[0], encoding="utf-8")
          PY
          node --check /tmp/training-inline.js
