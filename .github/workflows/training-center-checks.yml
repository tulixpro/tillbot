name: Training Center Syntax Checks

on:
  pull_request:
    paths:
      - "server.js"
      - "database.js"
      - "app.js"
      - "index.html"
      - "training.html"
      - "admin.html"
      - "training-import.js"
      - "training-import.test.js"
      - "sw.js"
      - ".github/workflows/training-center-checks.yml"

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check backend and frontend JavaScript
        run: |
          node --check server.js
          node --check app.js
      - name: Check training import helper syntax
        run: node --check training-import.js
      - name: Test training import validation
        run: node --test training-import.test.js
      - name: Check embedded page JavaScript
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          for page in ("training.html", "admin.html"):
              html = Path(page).read_text(encoding="utf-8")
              scripts = re.findall(r"<script>(.*?)</script>", html, flags=re.S)
              if len(scripts) != 1:
                  raise SystemExit(f"{page}: expected one inline script, found {len(scripts)}")
              target = Path("/tmp") / (page + ".js")
              target.write_text(scripts[0], encoding="utf-8")
          PY
          node --check /tmp/training.html.js
          node --check /tmp/admin.html.js
