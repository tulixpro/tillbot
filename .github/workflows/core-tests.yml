name: TILLBOT Core tests

on:
  pull_request:
    paths:
      - "core_model/**"
      - ".github/workflows/core-tests.yml"
  push:
    branches: [main]
    paths:
      - "core_model/**"
      - ".github/workflows/core-tests.yml"

permissions:
  contents: read

jobs:
  cpu-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: core_model/requirements.txt
      - name: Install Core dependencies
        run: python -m pip install --index-url https://download.pytorch.org/whl/cpu -r core_model/requirements.txt
      - name: Run CPU regression tests
        run: python -m unittest discover -s core_model -p 'test_*.py' -v
