name: Validate TILLBOT
on:
  pull_request:
  push:
    branches: [main]
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check backend JavaScript
        run: |
          node --check server.js
          node --check database.js
      - name: Check frontend JavaScript module
        run: node --check app.js
